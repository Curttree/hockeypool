name: Snapshot Standings

on:
  schedule:
    # Once daily. GitHub's cron scheduler isn't precise to the minute
    # (can slip under load) — irrelevant for a once-a-day trend line.
    - cron: "0 8 * * *"
  workflow_dispatch: {}

concurrency:
  group: snapshot-standings

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No package-lock.json (playwright has no runtime deps of its own
      # worth locking), so the cache key is just the package.json hash.
      - name: Cache npm dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: .github/scripts/node_modules
          key: node-modules-${{ hashFiles('.github/scripts/package.json') }}

      - name: Install script dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        working-directory: .github/scripts
        run: npm install

      # Split in two so a cache hit still gets OS-level deps installed
      # (fast, always needed on a fresh runner) while skipping the slow
      # ~300MB browser binary download whenever the version is unchanged.
      - name: Cache Playwright browser binaries
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('.github/scripts/package.json') }}

      - name: Install Playwright OS dependencies
        working-directory: .github/scripts
        run: npx playwright install-deps chromium

      - name: Install Playwright browser
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        working-directory: .github/scripts
        run: npx playwright install chromium

      - name: Capture standings snapshot
        working-directory: .github/scripts
        run: node snapshot-standings.mjs

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/standings-history.json
          git diff --cached --quiet || git commit -m "Snapshot standings for $(date -u +%Y-%m-%d)"
          git push
