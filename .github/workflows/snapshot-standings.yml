name: Snapshot Standings

on:
  schedule:
    # GitHub starts scheduled runs late under load, worst at the top of the
    # hour — a "0 8 * * *" schedule was starting 5-8 hours late, so the
    # morning recap (see recap.js) didn't appear until mid-morning. So: run
    # early and off the hour, with a backup later in the same UTC day. Both
    # snapshot the same date (see snapshot-standings.mjs) and a re-run just
    # overwrites that day's entry, so the backup is harmless when the first
    # run was on time — and re-captures anything still settling if it was
    # early. 06:23 UTC is 2:23am Eastern, after the last West Coast games.
    - cron: "23 6 * * *"
    - cron: "47 9 * * *"
  workflow_dispatch: {}

concurrency:
  group: snapshot-standings

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # No package-lock.json (playwright has no runtime deps of its own
      # worth locking), so the cache key is just the package.json hash.
      - name: Cache npm dependencies
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: .github/scripts/node_modules
          key: node-modules-${{ hashFiles('.github/scripts/package.json') }}

      - name: Install script dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        working-directory: .github/scripts
        run: npm install

      # Split in two so a cache hit still gets OS-level deps installed
      # (fast, always needed on a fresh runner) while skipping the slow
      # ~300MB browser binary download whenever the version is unchanged.
      - name: Cache Playwright browser binaries
        id: cache-playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('.github/scripts/package.json') }}

      - name: Install Playwright OS dependencies
        working-directory: .github/scripts
        run: npx playwright install-deps chromium

      - name: Install Playwright browser
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        working-directory: .github/scripts
        run: npx playwright install chromium

      - name: Capture standings snapshot
        working-directory: .github/scripts
        run: node snapshot-standings.mjs

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/standings-history.json data/player-points.json
          git diff --cached --quiet || git commit -m "Snapshot standings for $(date -u -d yesterday +%Y-%m-%d)"
          git push
