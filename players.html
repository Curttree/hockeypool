<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tremblay Hockey Pool - Player Selector</title>
<script>
  try {
    if (localStorage.getItem("nhl-points-theme") === "light") document.documentElement.dataset.theme = "light";
  } catch (e) {}
</script>
<meta name="description" content="Standings, rosters, and player stats for the Tremblay Hockey Pool.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tremblay Hockey Pool">
<meta property="og:title" content="Tremblay Hockey Pool - Player Selector">
<meta property="og:description" content="Standings, rosters, and player stats for the Tremblay Hockey Pool.">
<meta property="og:image" content="https://curttree.github.io/hockeypool/og-image.png">
<meta property="og:url" content="https://curttree.github.io/hockeypool/players.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Tremblay Hockey Pool - Player Selector">
<meta name="twitter:description" content="Standings, rosters, and player stats for the Tremblay Hockey Pool.">
<meta name="twitter:image" content="https://curttree.github.io/hockeypool/og-image.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="site-nav">
    <div class="site-nav-inner">
      <span class="site-nav-brand">Tremblay Hockey Pool</span>
      <div class="site-nav-links">
        <a href="./">Standings</a>
        <a href="games.html">Games</a>
        <a href="players.html">Players</a>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <header>
    <h1>Player Selector</h1>
    <div class="controls">
      <label for="season">Season</label>
      <select id="season"></select>
      <label for="limit">Per page</label>
      <select id="limit">
        <option value="25">25</option>
        <option value="50" selected>50</option>
        <option value="100">100</option>
      </select>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search player name…" autocomplete="off">
      <label for="max-points">Points ≤</label>
      <input id="max-points" type="number" min="0" step="1" placeholder="e.g. 50">
    </div>

    <p id="status" class="loading-pulse">Loading…</p>
    <div class="table-scroll">
      <table id="players-table" hidden>
        <thead>
          <tr>
            <th class="num">#</th>
            <th class="checkbox-col"></th>
            <th class="sortable" data-sort="player">Player<span class="sort-arrow"></span></th>
            <th class="sortable" data-sort="team">Team<span class="sort-arrow"></span></th>
            <th class="sortable" data-sort="pos">Pos<span class="sort-arrow"></span></th>
            <th class="num sortable" data-sort="gp">GP<span class="sort-arrow"></span></th>
            <th class="num sortable" data-sort="g">G<span class="sort-arrow"></span></th>
            <th class="num sortable" data-sort="a">A<span class="sort-arrow"></span></th>
            <th class="num sortable" data-sort="p">P<span class="sort-arrow"></span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="pager" class="pager" hidden>
      <button id="prev-page">Prev</button>
      <span id="page-info"></span>
      <button id="next-page">Next</button>
      <span class="page-jump">
        <label for="page-jump-input">Go to page</label>
        <input id="page-jump-input" type="number" min="1" step="1">
        <span id="page-count"></span>
      </span>
    </div>

    <section id="selected-section" class="selected-section">
      <div class="selected-header">
        <div class="selected-title-group">
          <h2 id="selected-title">Selected Players (<span id="selected-count">0</span>)</h2>
          <span id="selected-total" class="selected-total" hidden>Total points: <strong id="selected-total-value">0</strong></span>
        </div>
        <div class="selected-actions">
          <button id="fill-20">Fill to 20 (≤ 1000 pts)</button>
          <button id="export-csv" hidden>Export CSV</button>
          <button id="clear-selected" hidden>Clear all</button>
        </div>
      </div>
      <p id="fill-status" class="muted-note" hidden></p>
      <p id="selected-empty" class="muted-note">No players selected yet — check the box next to a player to add them here.</p>
      <table id="selected-table" hidden>
        <thead>
          <tr>
            <th>Player</th>
            <th>Team</th>
            <th>Pos</th>
            <th class="num">P</th>
            <th class="num"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
