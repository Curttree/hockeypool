<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tremblay Hockey Pool - Team</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="site-nav">
    <div class="site-nav-inner">
      <span class="site-nav-brand">Tremblay Hockey Pool</span>
      <div class="site-nav-links">
        <a href="/">Standings</a>
        <a href="/players.html">Players</a>
      </div>
    </div>
  </nav>

  <header>
    <div>
      <a href="/" class="back-link">&larr; Back to Standings</a>
      <h1 id="team-title">Team</h1>
    </div>
    <span id="season-label" class="season-label"></span>
  </header>

  <main>
    <p id="status">Loading…</p>
    <div class="table-scroll">
      <table id="team-table" hidden>
        <thead>
          <tr>
            <th>Skaters</th>
            <th>Team</th>
            <th class="num">Score</th>
            <th class="num">G</th>
            <th class="num">A</th>
          </tr>
        </thead>
        <tbody></tbody>
        <tfoot></tfoot>
      </table>
    </div>
  </main>

  <script src="common.js"></script>
  <script src="teams.js"></script>
  <script src="team.js"></script>
</body>
</html>
