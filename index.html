<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tremblay Hockey Pool - Standings</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="site-nav">
    <div class="site-nav-inner">
      <span class="site-nav-brand">Tremblay Hockey Pool</span>
      <div class="site-nav-links">
        <a href="/">Standings</a>
        <a href="/players.html">Players</a>
      </div>
    </div>
  </nav>

  <header>
    <h1>Standings</h1>
    <div class="controls">
      <label for="season">Pool Season</label>
      <select id="season"></select>
    </div>
  </header>

  <main>
    <p id="status">Loading…</p>
    <div class="table-scroll">
      <table id="standings-table" hidden>
        <thead>
          <tr>
            <th class="num">Rank</th>
            <th>Team</th>
            <th class="num">Score</th>
            <th class="num">Behind Next</th>
            <th class="num">Behind 1st</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <script src="common.js"></script>
  <script src="teams.js"></script>
  <script src="standings.js"></script>
</body>
</html>
