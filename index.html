<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tremblay Hockey Pool - Standings</title>
<script>
  try {
    if (localStorage.getItem("nhl-points-theme") === "light") document.documentElement.dataset.theme = "light";
  } catch (e) {}
</script>
<meta name="description" content="Standings, rosters, and player stats for the Tremblay Hockey Pool.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tremblay Hockey Pool">
<meta property="og:title" content="Tremblay Hockey Pool - Standings">
<meta property="og:description" content="Standings, rosters, and player stats for the Tremblay Hockey Pool.">
<meta property="og:image" content="https://curttree.github.io/hockeypool/og-image.png">
<meta property="og:url" content="https://curttree.github.io/hockeypool/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Tremblay Hockey Pool - Standings">
<meta name="twitter:description" content="Standings, rosters, and player stats for the Tremblay Hockey Pool.">
<meta name="twitter:image" content="https://curttree.github.io/hockeypool/og-image.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="site-nav">
    <div class="site-nav-inner">
      <span class="site-nav-brand">Tremblay Hockey Pool</span>
      <div class="site-nav-links">
        <a href="./">Standings</a>
        <a href="players.html">Players</a>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <header>
    <h1>Standings</h1>
    <div class="controls" id="season-controls">
      <label for="season">Pool Season</label>
      <select id="season"></select>
    </div>
  </header>

  <main>
    <section id="recap" class="recap" aria-label="Recap of the latest games" hidden></section>
    <p id="status" class="loading-pulse">Loading…</p>
    <div class="table-scroll">
      <table id="standings-table" hidden>
        <thead>
          <tr>
            <th class="num">Rank</th>
            <th class="team-logo-col"></th>
            <th>Team</th>
            <th class="num">Score</th>
            <th class="num">Behind Next</th>
            <th class="num">Behind 1st</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <section class="chart-section">
      <div class="selected-header">
        <h2>Standings Over Time</h2>
        <div class="controls" id="chart-controls">
          <label for="chart-range">Range</label>
          <select id="chart-range">
            <option value="week">1 Week</option>
            <option value="month">1 Month</option>
            <option value="season" selected>Season</option>
            <option value="projected">Projected</option>
          </select>
        </div>
      </div>
      <p id="chart-status" class="muted-note loading-pulse">Loading history…</p>
      <div class="chart-container">
        <canvas id="standings-chart" hidden></canvas>
      </div>
      <p id="chart-hint" class="muted-note" hidden>Click a team in the legend to isolate its line. Click it again to restore all.</p>
      <p id="projection-note" class="muted-note" hidden>Dashed lines project each team's full-season pace.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="common.js"></script>
  <script src="teams.js"></script>
  <script src="standings.js"></script>
  <script src="history.js"></script>
  <script src="recap.js"></script>
</body>
</html>
